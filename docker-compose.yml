version: "3.9"

services:

  # --- Provided sim harness services ---
  # These are Stand's services — do not modify them.
  # Source: ../sim-harness/docker-compose.yml
  # Build context is the sim-harness repo root (each Dockerfile does
  # `COPY shared ./shared` relative to that root), not the service subdir.

  leadgen:
    build:
      context: ../sim-harness
      dockerfile: leadgen/Dockerfile
    ports:
      - "8002:8080"
    volumes:
      - ../sim-harness/data:/data
      - ../sim-harness/shared:/app/shared
    environment:
      - DATABASE_URL=sqlite:////data/leadgen.db

  mailbox:
    build:
      context: ../sim-harness
      dockerfile: mailbox/Dockerfile
    ports:
      - "8001:8080"
    volumes:
      - ../sim-harness/data:/data
      - ../sim-harness/shared:/app/shared
    environment:
      - DATABASE_URL=sqlite:////data/mailbox.db

  # --- Your backend ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ../sim-harness/shared:/app/shared
    environment:
      - MAILBOX_URL=http://mailbox:8080
      - LEADGEN_URL=http://leadgen:8080
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - leadgen
      - mailbox